<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login Facebook</title>
    <link rel="stylesheet" href="desain.css">
</head>
<body>
    <nav>
        <div class="logo-box">
            <a href="https://facebook.com">
                <img src="fb.png" alt="facebook" width="50" height="50">
            </a>
            <span>Facebook</span>
        </div>
        <div class="menu-box">
            <a href="#beranda">Beranda</a>
            <a href="https://meta.com" target="_blank">Tentang</a>
            <a href="#kontak">Kontak</a>
        </div>
    </nav>

    <div class="main-container">
        <form class="login">
            <h2>Masuk ke Facebook</h2>
            <input type="text" name="username" placeholder="Username" required autocomplete="username">
            <input type="password" name="password" placeholder="Kata sandi" required autocomplete="current-password">
            <button type="submit">Masuk</button>
            <a href="#" class="lupa">Lupa kata sandi?</a>
        </form>
    </div>
</body>
</html>
